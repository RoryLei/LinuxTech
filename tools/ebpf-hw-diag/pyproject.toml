[project]
name = "ebpf-hw-diag"
version = "0.1.0"
description = "eBPF-based hardware diagnostics agent for AI/Storage servers"
requires-python = ">= 3.10"
license = {text = "Apache-2.0"}
authors = [{name = "LinuxTech"}]
dependencies = [
    "pyyaml>=6.0",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
bcc = ["bcc>=0.28"]
test = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
]

[project.scripts]
diag = "cli.main:main"
diagd = "agent_cmd.diagd.main:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["events", "core", "collectors", "exporters", "correlator", "config", "cli"]
